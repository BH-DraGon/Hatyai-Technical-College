<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inno Tech Wellness Centre - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-[#f4f7fa] to-[#e8eff5] min-h-screen flex flex-col justify-center items-center p-6 antialiased selection:bg-teal-500 selection:text-white">

    <div class="w-full max-w-[440px]">
        <div class="text-center mb-6 space-y-1">
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">วิทยาลัยเทคนิคหาดใหญ่</h1>
            <p class="text-xs text-slate-400 font-light tracking-wider uppercase">Hatyai Technical College</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl shadow-slate-200/80 p-8 md:p-10 border border-slate-100">
            <div class="mb-6 text-center">
                <div class="w-12 h-12 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-teal-100">
                    <i class="fa-solid fa-shield-keyhole"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-800 mb-1.5">กู้คืนรหัสผ่าน</h2>
                <p id="step-desc" class="text-sm text-slate-400 leading-relaxed">กรุณาระบุที่อยู่อีเมลที่ท่านใช้ในการลงทะเบียนระบบ บัญชีผู้ใช้ เพื่อรับรหัสยืนยันตัวตน (OTP) สำหรับระบุรหัสผ่านใหม่</p>
            </div>
            
            <form id="forgot-form" class="space-y-5">
                
                <div id="step-1-fields" class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">อีเมลที่ใช้สมัครสมาชิก</label>
                    <div class="relative group">
                        <input id="forgot-email" type="email" placeholder="example@domain.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-regular fa-envelope"></i></span>
                    </div>
                </div>

                <div id="step-2-fields" class="hidden space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1 text-teal-600">รหัสยืนยัน OTP (6 หลัก)</label>
                    <div class="relative group">
                        <input id="otp-input" type="text" maxlength="6" placeholder="กรอกรหัส 6 หลัก" class="w-full px-4 py-3 bg-slate-50 border border-teal-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 text-center tracking-widest font-bold text-lg transition duration-200">
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-regular fa-comment-dots"></i></span>
                    </div>
                </div>

                <div id="step-3-fields" class="hidden space-y-4 border-t border-slate-100 pt-3">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 block pl-1">รหัสผ่านใหม่</label>
                        <div class="relative group">
                            <input id="new-password" type="password" placeholder="กำหนดรหัสผ่านใหม่" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200">
                            <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-solid fa-lock"></i></span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 block pl-1">ยืนยันรหัสผ่านใหม่</label>
                        <div class="relative group">
                            <input id="confirm-new-password" type="password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200">
                            <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-solid fa-lock"></i></span>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button id="submit-btn" type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-teal-600/20 transition duration-200 flex items-center justify-center">
                        <span id="btn-text">ส่งรหัส OTP</span>
                    </button>
                </div>

                <div class="text-center text-sm text-slate-500 pt-1">
                    ย้อนกลับไปหน้า <a href="./login.html" class="text-teal-600 font-semibold hover:text-teal-700 hover:underline transition duration-150">เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            emailjs.init("_OUYCy0aIXwZfI8yv"); 
        })();

        let currentStep = 1; 
        let generatedOTP = "";
        let matchedUserIndex = -1;
        const users = JSON.parse(localStorage.getItem('wellness_users')) || [];

        const stepDesc = document.getElementById('step-desc');
        const forgotEmail = document.getElementById('forgot-email');
        const otpInput = document.getElementById('otp-input');
        const newPassword = document.getElementById('new-password');
        const confirmNewPassword = document.getElementById('confirm-new-password');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        document.getElementById('forgot-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            if (currentStep === 1) {
                const email = forgotEmail.value.trim();
                matchedUserIndex = users.findIndex(user => user.email === email);

                if (matchedUserIndex === -1) {
                    alert('ไม่พบอีเมลนี้ในระบบ กรุณาตรวจสอบอีกครั้ง');
                    return;
                }

                generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
                btnText.textContent = "กำลังส่งอีเมล...";
                submitBtn.setAttribute('disabled', 'true');

                const templateParams = {
                    to_email: email,
                    to_name: users[matchedUserIndex].name,
                    otp_code: generatedOTP
                };

                emailjs.send('service_bd51lbc', 'template_rgyde0p', templateParams, '_OUYCy0aIXwZfI8yv')
                    .then(function(response) {
                        alert('ระบบได้ดำเนินการจัดส่งรหัสยืนยันตัวตน (OTP) ไปยังอีเมลของท่านเรียบร้อยแล้ว');
                        proceedToStep2();
                    }, function(error) {
                        console.error("EmailJS Error Log:", error);
                        alert('ระบบขัดข้องชั่วคราว รหัส OTP สำหรับทดสอบของคุณคือ: ' + generatedOTP);
                        proceedToStep2();
                    });
            } 
            else if (currentStep === 2) {
                if (otpInput.value.trim() === generatedOTP) {
                    currentStep = 3;
                    stepDesc.textContent = "กรุณากำหนดรหัสผ่านใหม่สำหรับบัญชีผู้ใช้ของท่าน";
                    document.getElementById('step-2-fields').classList.add('hidden');
                    document.getElementById('step-3-fields').classList.remove('hidden');
                    
                    newPassword.setAttribute('required', 'true');
                    confirmNewPassword.setAttribute('required', 'true');
                    
                    btnText.textContent = "บันทึกรหัสผ่านใหม่";
                    submitBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
                } else {
                    alert('รหัส OTP ไม่ถูกต้อง กรุณาตรวจสอบในกล่องข้อความอีเมลของท่านอีกครั้ง');
                }
            } 
            else if (currentStep === 3) {
                const pass = newPassword.value;
                const confirmPass = confirmNewPassword.value;

                if (pass !== confirmPass) {
                    alert('รหัสผ่านไม่ตรงกัน กรุณากรอกรหัสผ่านให้ตรงกันทั้งสองช่อง');
                    return;
                }

                users[matchedUserIndex].password = pass;
                localStorage.setItem('wellness_users', JSON.stringify(users));

                alert('เปลี่ยนรหัสผ่านเสร็จสมบูรณ์ ระบบจะนำท่านกลับไปยังหน้าเข้าสู่ระบบ');
                window.location.href = './login.html'; // ลิงก์ย้ายหน้าแบบตรงโฟลเดอร์สำหรับ GitHub Pages
            }
        });

        function proceedToStep2() {
            currentStep = 2;
            submitBtn.removeAttribute('disabled');
            stepDesc.textContent = "ระบบได้ดำเนินการจัดส่งรหัสยืนยันตัวตน (OTP) ไปยังอีเมลของท่านเรียบร้อยแล้ว กรุณาตรวจสอบกล่องข้อความหรืออีเมลขยะ (Spam) และนำรหัส 6 หลักมาระบุภายในเวลาที่กำหนด";
            forgotEmail.setAttribute('disabled', 'true');
            document.getElementById('step-2-fields').classList.remove('hidden');
            otpInput.setAttribute('required', 'true');
            btnText.textContent = "ยืนยันรหัส OTP";
            submitBtn.classList.replace('bg-teal-600', 'bg-blue-600');
            submitBtn.classList.replace('hover:bg-teal-700', 'hover:bg-blue-700');
        }
    </script>
</body>
</html>
