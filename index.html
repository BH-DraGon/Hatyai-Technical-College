<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inno Tech Wellness Centre - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f0f4f8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white px-8 py-4 flex items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 flex items-center justify-center bg-red-100 rounded-full text-red-500 font-bold text-xl shadow-inner">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold text-red-600 leading-tight">Inno Tech</h1>
                <p class="text-sm font-bold text-blue-600 leading-tight">Wellness Centre</p>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-6 md:p-12 max-w-6xl mx-auto w-full gap-12 lg:gap-20">
        
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-center text-center">
            <svg class="w-56 h-56 md:w-64 md:h-64 mb-6 shadow-sm rounded-full" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="85" stroke="#8B2626" stroke-width="6"/>
                <circle cx="100" cy="100" r="75" stroke="#000000" stroke-width="2" stroke-dasharray="4 4"/>
                <path d="M100 35 C65 35, 50 60, 50 100 C50 140, 65 165, 100 165 C135 165, 150 140, 150 100 C150 60, 135 35, 100 35 Z" fill="#D2B48C" stroke="#8B2626" stroke-width="3"/>
                <circle cx="100" cy="100" r="35" fill="#8B2626" stroke="#000000" stroke-width="2"/>
                <circle cx="100" cy="100" r="25" fill="#FFD700"/>
                <path d="M100 80 L105 95 L120 100 L105 105 L100 120 L95 105 L80 100 L95 95 Z" fill="#8B2626"/>
            </svg>
            <h2 class="text-xl font-bold text-gray-800 tracking-wide">วิทยาลัยเทคนิคหาดใหญ่</h2>
            <p class="text-sm text-gray-500 font-medium mt-1">Hatyai Technical College</p>
        </div>

        <div class="w-full lg:w-[420px]">
            <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
                <h2 class="text-2xl font-bold text-blue-900 text-center mb-6 tracking-wide">ลงทะเบียน</h2>
                
                <form action="login.html" method="GET" class="space-y-4">
                    <div class="relative">
                        <input type="text" placeholder="ชื่อ - นามสกุล" value="รัฐกร นวลเจริญ" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 pr-10 text-gray-700 font-medium">
                        <span class="absolute right-4 top-3.5 text-gray-400 text-lg"><i class="fa-regular fa-id-card"></i></span>
                    </div>
                    <div class="relative">
                        <input type="email" placeholder="อีเมล" value="manu2427xxx@gmail.com" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 pr-10 text-gray-700 font-medium">
                        <span class="absolute right-4 top-3.5 text-gray-400 text-lg"><i class="fa-regular fa-envelope"></i></span>
                    </div>
                    <div class="relative">
                        <input type="password" placeholder="รหัสผ่าน" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 pr-10 text-gray-700 font-medium">
                        <span class="absolute right-4 top-3.5 text-gray-400 text-lg"><i class="fa-solid fa-lock"></i></span>
                    </div>
                    <div class="relative">
                        <input type="password" placeholder="ยืนยันรหัสผ่าน" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 pr-10 text-gray-700 font-medium">
                        <span class="absolute right-4 top-3.5 text-gray-400 text-lg"><i class="fa-solid fa-shield-halved"></i></span>
                    </div>
                    <div class="flex items-center space-x-2 text-sm text-gray-600 pt-1">
                        <label class="flex items-center space-x-2 cursor-pointer select-none">
                            <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" checked required>
                            <span class="font-medium">ฉันยอมรับ <a href="#" class="text-blue-600 hover:underline">เงื่อนไขการใช้งาน</a></span>
                        </label>
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md">สร้างบัญชีผู้ใช้</button>
                    </div>
                    <div class="text-center text-xs text-gray-400 font-medium my-4">หรือ</div>
                    <div class="text-center text-sm text-gray-600 font-medium">มีบัญชีอยู่แล้ว? <a href="login.html" class="text-blue-700 font-semibold hover:underline ml-1">เข้าสู่ระบบ</a></div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
