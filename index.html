<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inno Tech Wellness Centre - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-[#f4f7fa] to-[#e8eff5] min-h-screen flex flex-col justify-center items-center p-6 antialiased selection:bg-teal-500 selection:text-white">

    <div class="w-full max-w-[440px]">
        <div class="flex items-center justify-center gap-4 mb-6">
            <img src="logo.jpg" alt="Logo" class="w-16 h-16 object-contain">
            <div class="text-left">
                <h1 class="text-xl font-bold text-slate-800 tracking-tight leading-tight">วิทยาลัยเทคนิคหาดใหญ่</h1>
                <p class="text-xs text-slate-400 font-light tracking-wider uppercase">Hatyai Technical College</p>
                <div class="mt-1">
                    <span class="inline-block bg-teal-50 text-teal-700 px-2 py-0.5 rounded-full text-[10px] font-medium border border-teal-100/60">
                        Inno Tech Wellness Centre
                    </span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl shadow-slate-200/80 p-8 md:p-10 border border-slate-100">
            <div class="mb-6 text-center">
                <h2 class="text-2xl font-extrabold text-slate-800 mb-1">ลงทะเบียน</h2>
                <p class="text-sm text-slate-400">กรอกข้อมูลของคุณเพื่อเริ่มต้นสร้างบัญชีผู้ใช้</p>
            </div>
            
            <form id="register-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">ชื่อ - นามสกุล</label>
                    <div class="relative group">
                        <input id="reg-name" type="text" placeholder="กรอกชื่อและนามสกุลของคุณ" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-regular fa-id-card"></i></span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">อีเมล</label>
                    <div class="relative group">
                        <input id="reg-email" type="email" placeholder="example@domain.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-regular fa-envelope"></i></span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">รหัสผ่าน</label>
                    <div class="relative group">
                        <input id="reg-password" type="password" placeholder="กำหนดรหัสผ่านของคุณ" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-solid fa-lock"></i></span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">ยืนยันรหัสผ่าน</label>
                    <div class="relative group">
                        <input id="reg-confirm-password" type="password" placeholder="กรอกรหัสผ่านอีกครั้ง" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-solid fa-lock"></i></span>
                    </div>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-teal-600/20 transition duration-200">
                        สร้างบัญชีผู้ใช้
                    </button>
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-100"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-400 font-light">หรือ</span>
                    <div class="flex-grow border-t border-slate-100"></div>
                </div>

                <div class="text-center text-sm text-slate-500">
                    มีบัญชีอยู่แล้ว? <a href="./login.html" class="text-teal-600 font-semibold hover:text-teal-700 hover:underline ml-1 transition duration-150">เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                alert('รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง');
                return;
            }

            let users = JSON.parse(localStorage.getItem('wellness_users')) || [];

            if (users.some(user => user.email === email)) {
                alert('อีเมลนี้ถูกใช้ในการลงทะเบียนแล้ว');
                return;
            }

            users.push({ name, email, password });
            localStorage.setItem('wellness_users', JSON.stringify(users));

            alert('ลงทะเบียนสำเร็จ! ระบบจะพาคุณไปยังหน้าเข้าสู่ระบบ');
            window.location.href = './login.html'; 
        });
    </script>
</body>
</html>
