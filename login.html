<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inno Tech Wellness Centre - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f0f4f8; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10 max-w-md w-full border border-gray-50 text-center">
        
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-lg font-bold text-gray-800 tracking-wide mb-1">วิทยาลัยเทคนิคหาดใหญ่</h1>
            <p class="text-xs text-gray-400 font-medium uppercase tracking-wider mb-6">Hatyai Technical College</p>
            
            <div class="flex items-center space-x-3 mb-2">
                <div class="w-12 h-12 bg-red-50 border-2 border-red-800 rounded-full flex items-center justify-center text-red-800 font-bold text-lg shadow-sm">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div class="text-left">
                    <h2 class="text-xl font-bold text-gray-800 leading-tight">เข้าสู่ระบบ</h2>
                    <p class="text-xs text-gray-400 font-medium">กรุณาลงชื่อเข้าใช้งานบัญชีของคุณ</p>
                </div>
            </div>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-4 text-left">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">อีเมล</label>
                <div class="relative">
                    <input type="email" placeholder="กรอกอีเมลของคุณ" value="manu2427xxx@gmail.com" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 pr-10 text-gray-700 font-medium">
                    <span class="absolute right-4 top-3.5 text-gray-400"><i class="fa-regular fa-envelope"></i></span>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">รหัสผ่าน</label>
                <div class="relative">
                    <input type="password" placeholder="กรอกรหัสผ่านของคุณ" value="123456" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 pr-10 text-gray-700 font-medium">
                    <span class="absolute right-4 top-3.5 text-gray-400"><i class="fa-solid fa-lock"></i></span>
                </div>
            </div>
            
            <div class="flex items-center justify-between text-xs font-semibold text-gray-500 pt-1 select-none">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500" checked>
                    <span>จดจำไว้</span>
                </label>
                <a href="#" class="hover:underline hover:text-emerald-600">ลืมรหัสผ่าน?</a>
            </div>
            
            <div class="pt-2">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-md tracking-wide">เข้าสู่ระบบ</button>
            </div>
            
            <div class="text-center text-xs text-gray-300 font-medium my-4">หรือ</div>
            
            <div>
                <a href="index.html" class="w-full bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 font-bold py-3.5 rounded-xl transition duration-200 text-center block shadow-sm">ลงทะเบียนสมาชิกใหม่</a>
            </div>
        </form>
    </div>
</body>
</html>
