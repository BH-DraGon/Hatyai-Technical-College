<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inno Tech Wellness Centre - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-[#f4f7fa] to-[#e8eff5] min-h-screen flex flex-col justify-center items-center p-6 antialiased selection:bg-teal-500 selection:text-white">

    <div class="w-full max-w-[440px]">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">วิทยาลัยเทคนิคหาดใหญ่</h1>
            <p class="text-xs text-slate-400 font-light tracking-wider uppercase">Hatyai Technical College</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl shadow-slate-200/80 p-8 md:p-10 border border-slate-100">
            <div class="flex items-center justify-center gap-4 mb-8">
                <img src="logo.jpg" alt="Logo" class="w-16 h-16 object-contain">
                <div class="text-left">
                    <h2 class="text-2xl font-extrabold text-slate-800">เข้าสู่ระบบ</h2>
                    <p class="text-sm text-slate-400">กรุณาลงชื่อเข้าใช้งานบัญชีของคุณ</p>
                </div>
            </div>
            
            <form id="login-form" class="space-y-5">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">อีเมล</label>
                    <div class="relative group">
                        <input id="login-email" type="email" placeholder="กรอกอีเมลของคุณ" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-regular fa-envelope"></i></span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 block pl-1">รหัสผ่าน</label>
                    <div class="relative group">
                        <input id="login-password" type="password" placeholder="กรอกรหัสผ่านของคุณ" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent focus:bg-white pr-10 text-slate-700 transition duration-200" required>
                        <span class="absolute right-3.5 top-3.5 text-slate-400 group-focus-within:text-teal-500 transition duration-200"><i class="fa-solid fa-lock"></i></span>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer text-slate-600">
                        <input type="checkbox" class="w-4 h-4 text-teal-600 border-slate-300 rounded focus:ring-teal-500 focus:ring-offset-0 transition duration-150">
                        <span class="text-xs font-medium">จดจำไว้</span>
                    </label>
                    <a href="./forgot-password.html" class="text-xs font-medium text-slate-400 hover:text-teal-600 hover:underline transition duration-150">ลืมรหัสผ่าน?</a>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-teal-600/20 transition duration-200">
                        เข้าสู่ระบบ
                    </button>
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-100"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-400 font-light">หรือ</span>
                    <div class="flex-grow border-t border-slate-100"></div>
                </div>

                <div>
                    <a href="./register.html" class="w-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold py-3 rounded-xl transition duration-200 text-center block text-sm shadow-sm">
                        ลงทะเบียนสมาชิกใหม่
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const users = JSON.parse(localStorage.getItem('wellness_users')) || [];
            const matchedUser = users.find(user => user.email === email && user.password === password);

            if (matchedUser) {
                localStorage.setItem('current_session_user', JSON.stringify({ name: matchedUser.name }));
                window.location.href = './dashboard.html'; 
            } else {
                alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณากรอกใหม่อีกครั้ง');
            }
        });
    </script>
</body>
</html>
